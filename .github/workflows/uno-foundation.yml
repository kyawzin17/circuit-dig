name: UNO Foundation CI

on:
  push:
    branches: [main]
    paths:
      - "my-app/**"
      - ".github/workflows/uno-foundation.yml"
  pull_request:
    paths:
      - "my-app/**"
      - ".github/workflows/uno-foundation.yml"

jobs:
  uno-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: UNO foundation tests
        run: npm run test:uno

      - name: TypeScript + production build
        run: npm run build
