<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <defs>
    <!-- Dark Body Gradient -->
    <linearGradient id="battery-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="50%" stop-color="#374151" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Gold Accent Stripe Gradient -->
    <linearGradient id="gold-stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Metal Snap Terminals Gradient -->
    <linearGradient id="metal-snap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="50%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
  </defs>

  <!-- Main Battery Body -->
  <rect x="20" y="70" width="200" height="270" rx="16" fill="url(#battery-body)" stroke="#111827" stroke-width="3"/>

  <!-- Top Header Plate -->
  <rect x="30" y="50" width="180" height="30" rx="6" fill="#374151" stroke="#1F2937" stroke-width="2"/>

  <!-- Gold/Orange Brand Stripe -->
  <rect x="20" y="150" width="200" height="70" fill="url(#gold-stripe)"/>

  <!-- Positive (+) Terminal -->
  <circle cx="80" cy="35" r="14" fill="url(#metal-snap)" stroke="#374151" stroke-width="2"/>
  <circle cx="80" cy="35" r="8" fill="#9CA3AF"/>

  <!-- Negative (-) Terminal -->
  <circle cx="160" cy="35" r="18" fill="url(#metal-snap)" stroke="#374151" stroke-width="2"/>
  <circle cx="160" cy="35" r="11" fill="#4B5563"/>

  <!-- Polarity Indicators -->
  <text x="80" y="110" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#EF4444" text-anchor="middle">+</text>
  <text x="160" y="110" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#9CA3AF" text-anchor="middle">-</text>

  <!-- Battery Label Text -->
  <text x="120" y="195" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">9V</text>
  <text x="120" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9CA3AF" text-anchor="middle" letter-spacing="3">POWER SUPPLY</text>
</svg>
