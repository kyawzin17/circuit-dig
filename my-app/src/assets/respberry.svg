  <rect width="210" height="510" rx="10" fill="#087541" stroke="#06542F" stroke-width="2" />
  <path d="M 30,100 L 60,100 L 70,110 L 70,220 M 180,150 L 140,150 L 130,160 L 130,220" fill="none" stroke="#0B9B56" stroke-width="2" opacity="0.6"/>

